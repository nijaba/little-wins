# Settings (address, secret, sign-in apps, allowlist) go in .env, copied from .env.example.
# .env is git-ignored and never committed. See docs/admin-guide.md.
# To change the published port or add other compose settings, use docker-compose.override.yml
# (also git-ignored).
services:
  little-wins:
    build: .
    restart: unless-stopped
    ports: ["127.0.0.1:3000:3000"]
    env_file: .env
    environment:
      DATABASE_PATH: /data/little-wins.db
    volumes: ["./data:/data"]
