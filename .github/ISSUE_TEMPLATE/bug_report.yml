name: Bug report
description: Something does not work as it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For security problems, do not use this form. Use the private report link on the issue chooser page.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Sign in as a parent
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: From package.json, the image tag or `git rev-parse --short HEAD`.
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Self-hosted or hosted?
      options:
        - Self-hosted
        - Hosted by someone else
        - Local development (npm run dev)
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Browser and phone
      placeholder: Safari on iPhone, Chrome on Android, ...
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed personal data (children's names, emails) from what I pasted.
          required: true
