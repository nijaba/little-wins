# Lint, API tests (Node 22 and 24) with coverage, browser tests (Chromium and WebKit) and the
# container image. Linux runners only. Docs-only changes skip the heavy jobs, and the browser
# tests also skip when nothing they cover changed (the page, the server, the browser tests, the
# packages, this workflow). Only "CI passed" is required, so skipped jobs never block a merge.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
      e2e: ${{ steps.diff.outputs.e2e }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        name: Docs-only? Browser tests needed?
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Fail safe: anything we can't diff counts as code, with browser tests.
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            printf 'code=true\ne2e=true\n' >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed=$(git diff --name-only "$BASE" HEAD)
          if grep -qvE '^(docs/|site/|.*\.md$|LICENSE$|\.github/ISSUE_TEMPLATE/)' <<< "$changed"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
          # Browser tests run the real server and page: only changes there (or to the tests, the
          # packages, their settings or this workflow) can change what they see.
          if grep -qE '^(public/|server/|e2e/|package\.json$|package-lock\.json$|playwright\.config\.js$|\.github/workflows/ci\.yml$)' <<< "$changed"; then
            echo "e2e=true" >> "$GITHUB_OUTPUT"
          else
            echo "e2e=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: Lint
    needs: changes
    if: ${{ needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    name: API tests (Node ${{ matrix.node }})
    needs: changes
    if: ${{ needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    env:
      SKIP_IMAGE_TESTS: '1' # the image has its own job
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Tests
        if: ${{ matrix.node != 24 }}
        run: npm test
      - name: Tests with coverage
        if: ${{ matrix.node == 24 }}
        run: npm run test:coverage
      - name: Coverage report
        if: ${{ matrix.node == 24 && always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  # Side by side: Chromium in one job with 4 workers (the runner has 4 cores); WebKit, which needs
  # more of the machine (with 4 workers its tests timed out), in two halves with 2 workers each.
  e2e:
    name: Browser tests (${{ matrix.browser }} ${{ matrix.part }}/${{ matrix.parts }})
    needs: changes
    if: ${{ needs.changes.outputs.code != 'false' && needs.changes.outputs.e2e != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { browser: chromium, part: 1, parts: 1, workers: 4 }
          - { browser: webkit, part: 1, parts: 2, workers: 2 }
          - { browser: webkit, part: 2, parts: 2, workers: 2 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The browsers and the system packages they need, kept between runs. The install usually
      # takes about 40 s, but a slow package mirror once made it take 18 minutes; from the cache
      # it needs no mirror. The key changes when package-lock.json (Playwright's version) does.
      - name: Restore the browser and its packages
        id: browsers
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/browser-debs
          key: browsers-v2-${{ matrix.browser }}-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # Each try gets 5 minutes; a second try follows a failure or a hang.
      - name: Install the browser
        timeout-minutes: 12
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          echo 'Binary::apt::APT::Keep-Downloaded-Packages "true";' |
            sudo tee /etc/apt/apt.conf.d/99keep-debs >/dev/null
          mkdir -p ~/.cache/browser-debs
          if compgen -G ~/.cache/browser-debs/'*.deb' >/dev/null; then
            sudo cp ~/.cache/browser-debs/*.deb /var/cache/apt/archives/
          fi
          ok=
          for try in 1 2; do
            if timeout --kill-after=15s 5m npx playwright install --with-deps "$BROWSER"; then
              ok=1
              break
            fi
            echo "::warning::Browser install try $try failed or took over 5 minutes"
          done
          [ -n "$ok" ] || exit 1
          cp /var/cache/apt/archives/*.deb ~/.cache/browser-debs/ 2>/dev/null || true
      - name: Keep the browser and its packages
        if: ${{ steps.browsers.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/browser-debs
          key: ${{ steps.browsers.outputs.cache-primary-key }}
      - name: Run the browser tests
        env:
          BROWSER: ${{ matrix.browser }}
          SHARD: ${{ matrix.part }}/${{ matrix.parts }}
          WORKERS: ${{ matrix.workers }}
        run: npx playwright test --project="$BROWSER" --shard="$SHARD" --workers="$WORKERS"
      - name: Report
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.browser }}-${{ matrix.part }}
          path: playwright-report/
          retention-days: 7

  image:
    name: Container image
    needs: changes
    if: ${{ needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Build and test the hardened image
        run: node --test test/image.test.js

  # One stable check to require in branch protection.
  ci-ok:
    name: CI passed
    needs: [changes, lint, test, e2e, image]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: All jobs passed, or were skipped because nothing they cover changed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) exit 1 ;; esac
          done
