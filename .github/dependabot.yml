# Weekly updates for dev tools, pinned GitHub Actions and the pinned base image.
# Cooldown: only propose releases that have been out for 14 days, the same rule used when
# pinning by hand (fresh releases are where broken or malicious versions show up first).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      dev-tools:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
