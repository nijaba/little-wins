<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name=apple-mobile-web-app-capable content=yes><meta name=apple-mobile-web-app-title content="Little Wins"><link rel=manifest href=manifest.json><title>Little Wins</title>
<style>:root{--n:#1f3a5f;--t:#2a7f8e;--l:#e8f1f4}body{margin:0;font:16px -apple-system,sans-serif;background:#f6f8f9;padding-bottom:70px}header{background:var(--n);color:#fff;padding:env(safe-area-inset-top) 14px 12px;text-align:center}header b{font-size:30px;display:block}.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid #ccd;padding-bottom:env(safe-area-inset-bottom)}.tabs button{flex:1;border:0;background:0;padding:6px 0 8px;font-size:11px;color:#667;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:inherit}.tabs i{font-style:normal;font-size:22px;line-height:1;padding:3px 14px;border-radius:14px}.tabs .on{color:var(--t);font-weight:700}.tabs .on i{background:var(--l)}main{padding:10px}.card{background:#fff;border-radius:12px;padding:12px;margin:8px 0;box-shadow:0 1px 3px #0002}.row{display:flex;gap:8px;align-items:center;justify-content:space-between}.row>div:first-child{flex:1;min-width:0;overflow-wrap:anywhere}.row>div:last-child:not(:first-child){display:flex;gap:6px;flex-shrink:0;align-items:center}.row.stk{flex-wrap:wrap}.row.stk>div:first-child{flex:1 1 100%}.row.stk>div:last-child{margin-left:auto}small{color:#778}.b{white-space:nowrap;border:0;border-radius:8px;padding:9px 12px;font-size:15px;background:var(--t);color:#fff}.b.r{background:#c0392b}.b.w{background:#e0a100}.b.g{background:#999}.bar{height:10px;background:#dde;border-radius:6px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--t)}#toast{position:fixed;left:12px;right:12px;bottom:calc(64px + env(safe-area-inset-bottom));background:#222;color:#fff;border-radius:10px;padding:10px 12px;display:none;justify-content:space-between;align-items:center;z-index:9;gap:8px}#party{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:10;text-align:center;font-size:22px}#party div{background:#fff;border-radius:18px;padding:28px 36px;font-size:24px}#party span{font-size:64px;display:block;animation:pop .6s ease infinite alternate}@keyframes pop{to{transform:scale(1.25) rotate(8deg)}}.strip{display:flex;gap:4px;margin-top:8px}.strip .d{flex:1;border:0;border-radius:8px;padding:6px 0;font-size:13px;background:var(--l);color:var(--n);text-align:center;line-height:1.5;font-family:inherit}.strip .perfect{background:#cdeedd;color:#12633a}.strip .ok{background:#fff1c2;color:#7a5b00}.strip .bad{background:#f7d4d0;color:#9b2c20}.strip .fut{opacity:.4}h3{margin:16px 4px 0;color:var(--n)}.wnav{display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:center}.wnav .b{font-size:22px;padding:6px 16px}.b:disabled{opacity:.35}.fold{margin:8px 0}.fold summary{list-style:none;display:flex;align-items:center;gap:8px;padding:14px 12px;background:#fff;border-radius:12px;box-shadow:0 1px 3px #0002;font-weight:700;color:var(--n);font-size:17px;cursor:pointer}.fold summary::-webkit-details-marker{display:none}.fold summary::after{content:'›';margin-left:auto;font-size:24px;line-height:1;color:#99a;transition:transform .15s}.fold[open] summary::after{transform:rotate(90deg)}.fold .cnt{font-size:13px;font-weight:400;color:#778;background:var(--l);border-radius:10px;padding:1px 8px}.fold[open]>summary{margin-bottom:4px}.fold>.b{margin:4px 0 8px}input{font-size:20px;padding:10px;width:70%;text-align:center}</style></head><body><div id=app></div><div id=toast></div><div id=party></div><script>
let S=null,tab='today';const $=s=>document.getElementById(s);
let wkSel=null;const wq=()=>wkSel?'?week='+wkSel:'';
function goWeek(w){wkSel=w;api('state')}
async function api(p,b){const r=await fetch('/api/'+p+wq(),{method:b?'POST':'GET',headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});if(r.status==401){S=null;return login()}const j=await r.json();if(j.error){alert(j.error);return false}S=j;wkSel=S.week.current?null:S.week.start;render();return true}
let ed=null;const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function edit(t,id,kind){const l=t==='r'?S.rewards:S.items;ed=id?{...l.find(x=>x.id===id),t,kind}:{t,kind,name:'',note:'',pmin:5,pmax:5,stars:12,points:0};render()}
async function saveEd(){const g=k=>($(k)||{}).value||'',r=ed.t==='r';const ok=await api(r?'reward/save':'item/save',r?{id:ed.id,name:g('f_name'),stars:g('f_stars'),points:g('f_points')}:{id:ed.id,kind:ed.kind,name:g('f_name'),note:g('f_note'),pmin:g('f_min'),pmax:ed.kind==='target'?g('f_max'):g('f_min')});if(ok){ed=null;render()}}
const mvb=(t,id,x,n)=>(x?`<button class="b g" onclick="mv('${t}',${id},-1)">▲</button> `:'')+(x<n-1?`<button class="b g" onclick="mv('${t}',${id},1)">▼</button> `:'');
function mv(t,id,d){api(t+'/move',{id,dir:d})}
function delItem(id){if(confirm('Remove this? Past history is kept.'))api('item/delete',{id})}
function revoke(id,me){if(confirm(me?'Log out this device? You will need the PIN again.':'Log out that device? It will need the PIN again.'))api('session/revoke',{id})}
const ago=t=>{const m=(Date.now()-Date.parse(t))/6e4;return m<10?'just now':m<90?Math.round(m)+' min ago':m<2160?Math.round(m/60)+' h ago':Math.round(m/1440)+' days ago'};
const op={},fold=(k,t,n,body)=>`<details class=fold ${op[k]?'open':''} ontoggle="op['${k}']=this.open"><summary><span>${t}</span><span class=cnt>${n}</span></summary>${body}</details>`;
function delRew(id){if(confirm('Remove this reward?'))api('reward/delete',{id})}
function login(){$('app').innerHTML='<main style=text-align:center><h2>Little Wins</h2><input id=pin type=password inputmode=numeric placeholder=PIN><p><button class=b onclick="doLogin()">Enter</button></p></main>'}
async function doLogin(){const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin:$('pin').value})});if(r.ok)api('state');else alert((await r.json().catch(()=>({}))).error||'Wrong PIN')}
const P=()=>S.role==='parent',bar=(a,b)=>`<div class=bar><i style="width:${Math.min(100,b?100*a/b:100)}%"></i></div>`;
let tt;function hideToast(){$('toast').style.display='none'}
function toast(m,id){const t=$('toast');t.innerHTML=`<span>${esc(m)}</span>`+(id?`<button class="b g" onclick="api('undo',{id:${id}});hideToast()">Undo</button>`:'');t.style.display='flex';clearTimeout(tt);tt=setTimeout(hideToast,6000)}
const desc=e=>e.kind==='points'?(e.points>0?'+':'')+e.points+' · '+e.name:e.kind==='warn'?'⚠ Warning · '+e.name:e.name+': '+e.note;
async function act(p,b){if(await api(p,b)&&S.hist[0])toast(desc(S.hist[0]),S.hist[0].id)}
function cyc(id,k){const c=S.week.marks[id][k];act('mark',{item_id:id,mark:{null:'perfect',perfect:'ok',ok:'bad',bad:'perfect'}[c],day:S.week.days[k]})}
function ring(){const r=S.rewards.find(x=>!(S.stars>=x.stars&&S.balance>=x.points));if(!r)return'<div class=card style=text-align:center>🎉 Everything unlocked!</div>';
 const a=Math.min(1,S.stars/(r.stars||1)),b=r.points?Math.min(1,S.balance/r.points):a,pc=Math.round(100*(r.stars&&r.points?(a+b)/2:r.points?b:a)),C=264;
 return `<div class=card style="display:flex;gap:14px;align-items:center"><svg width=96 height=96 viewBox="0 0 100 100"><circle cx=50 cy=50 r=42 fill=none stroke="#dde" stroke-width=10 /><circle cx=50 cy=50 r=42 fill=none stroke="#2a7f8e" stroke-width=10 stroke-linecap=round stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pc/100)}" transform="rotate(-90 50 50)"/><text x=50 y=57 text-anchor=middle font-size=22 font-weight=700 fill="#1f3a5f">${pc}%</text></svg><div><small>Next reward</small><br><b>${esc(r.name)}</b><br><small>${S.stars}/${r.stars} ★${r.points?' · '+S.balance+'/'+r.points+' pts':''}</small></div></div>`}
function party(n){const p=$('party');p.innerHTML=`<div onclick="this.parentNode.style.display='none'"><span>🎉</span>Reward unlocked!<br><b>${esc(n)}</b></div>`;p.style.display='flex';setTimeout(()=>p.style.display='none',7000)}
function celebrate(){try{const ids=S.rewards.filter(r=>S.stars>=r.stars&&S.balance>=r.points).map(r=>r.id),k='seen_'+S.role,seen=JSON.parse(localStorage.getItem(k)||'null');localStorage.setItem(k,JSON.stringify(ids));if(!seen)return;const nw=S.rewards.filter(r=>ids.includes(r.id)&&!seen.includes(r.id));if(nw.length)party(nw[0].name)}catch{}}
function add(id,i){let p;if(i.pmin!==i.pmax){p=prompt(`Points (${i.pmin}-${i.pmax})`,i.pmin);if(p===null)return}act('add',{item_id:id,points:p})}
function pen(id){const i=S.items.find(x=>x.id===id);if(i&&confirm('Record penalty: '+i.name+'?'))act('add',{item_id:id})}
function render(){const T={today:['☀️','Today'],week:['⭐','Week'],rew:['🏆','Rewards'],hist:['🕘','History']};if(P())T.set=['⚙️','Settings'];let h=`<header><b>${S.balance} pts · ${S.stars} ★</b>${S.today}</header><main>`;
 if(tab==='today'){if(!P())h+=ring();h+=P()?'<h3>Earn points</h3>':'<h3>Ways to earn points</h3>';S.items.filter(i=>i.kind==='target').forEach(i=>{h+=`<div class=card><div class=row><div>${esc(i.name)}<br><small>${i.note?esc(i.note)+' · ':''}${i.pmin===i.pmax?i.pmin:i.pmin+'-'+i.pmax} pts</small></div>${P()?`<div><button class=b onclick="add(${i.id},S.items.find(x=>x.id==${i.id}))">+</button> <button class="b w" onclick="act('warn',{item_id:${i.id}})">⚠${S.warn[i.id]||0}/2</button></div>`:''}</div></div>`});
  if(P()){h+='<h3>Penalties</h3>';S.items.filter(i=>i.kind==='penalty').forEach(i=>h+=`<div class=card><div class=row><div>${esc(i.name)}<br><small>${esc(i.note)}</small></div><button class="b r" onclick="pen(${i.id})">-${i.pmin}</button></div></div>`)}}
 if(tab==='week'){const W=S.week,fd=d=>new Date(d+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'}),nw=Object.keys(S.won).length;
 h+=`<div class="card wnav"><button class="b g" ${W.prev?`onclick="goWeek('${W.prev}')"`:'disabled'} aria-label="Previous week">‹</button><div><b>${W.current?'This week':'Week of '+fd(W.days[0])}</b><br><small>${fd(W.days[0])} – ${fd(W.days[6])}${nw?` · ${nw} ★ won`:''}</small></div><button class="b g" ${W.next?`onclick="goWeek('${W.next}')"`:'disabled'} aria-label="Next week">›</button></div>`+(W.current?'':`<p style=text-align:center;margin:4px><button class="b g" onclick="goWeek(null)">Back to this week</button></p>`);
 h+='<h3>Weekly challenges</h3><small style=margin:4px>Win ★ with 2+ perfect days and no bad days in the week.'+(P()?' Tap a day to set ✓ perfect, ~ ok or ✗ bad.':'')+'</small>';S.items.filter(i=>i.kind==='challenge').forEach(i=>{const m=S.week.marks[i.id]||[],pf=m.filter(x=>x==='perfect').length,bd=m.includes('bad');
 h+=`<div class=card><div class=row><div>${esc(i.name)}<br><small>${S.won[i.id]?'':pf+'/2 perfect days'+(bd?' · a bad day':'')}</small></div>${S.won[i.id]?'<b>★ won</b>':''}</div><div class=strip>${S.week.days.map((d,k)=>{const v=m[k],fut=d>S.today,sym={perfect:'✓',ok:'~',bad:'✗'}[v]||'·';return P()&&!fut?`<button class="d ${v||''}" onclick="cyc(${i.id},${k})">${S.week.lbl[k]} ${+d.slice(8)}<br>${sym}</button>`:`<span class="d ${v||''}${fut?' fut':''}">${S.week.lbl[k]} ${+d.slice(8)}<br>${sym}</span>`}).join('')}</div></div>`})}
 if(tab==='rew'){h+=ring()+'<h3>Rewards</h3>';S.rewards.forEach(r=>{const ok=S.stars>=r.stars&&S.balance>=r.points;h+=`<div class=card><div class=row><b>${esc(r.name)}</b><span>${ok?'✅ unlocked':''}</span></div><small>${r.stars} ★ ${r.points?'+ '+r.points+' pts':''}</small>${bar(S.stars,r.stars)}${r.points?bar(S.balance,r.points):''}</div>`})}
 if(tab==='hist'){h+='<h3>History</h3>';S.hist.forEach(e=>h+=`<div class=card><div class=row><div>${esc(e.name)} ${e.kind==='warn'?'⚠ warning':e.kind==='mark'?'mark: '+esc(e.note):''}<br><small>${new Date(e.ts).toLocaleString()} ${e.note&&e.kind==='points'?'· '+esc(e.note):''}</small></div><div>${e.kind==='points'?(e.points>0?'+':'')+e.points:''} ${P()?`<button class="b g" onclick="api('undo',{id:${e.id}})">undo</button>`:''}</div></div></div>`)}
 if(tab==='set'&&P()){if(ed){const r=ed.t==='r',k=ed.kind;h+=`<div class=card><h3 style=margin:0>${ed.id?'Edit':'Add'} ${r?'reward':k}</h3><p>Name<br><input id=f_name value="${esc(ed.name)}"></p>`+(r?`<p>Stars needed<br><input id=f_stars type=number inputmode=numeric value="${ed.stars}"></p><p>Points needed<br><input id=f_points type=number inputmode=numeric value="${ed.points}"></p>`:k==='challenge'?'':`<p>Note (e.g. per day)<br><input id=f_note value="${esc(ed.note)}"></p><p>${k==='penalty'?'Points lost':'Points (min)'}<br><input id=f_min type=number inputmode=numeric value="${ed.pmin}"></p>`+(k==='target'?`<p>Points (max; same as min if fixed)<br><input id=f_max type=number inputmode=numeric value="${ed.pmax}"></p>`:''))+`<button class=b onclick=saveEd()>Save</button> <button class="b g" onclick="ed=null;render()">Cancel</button></div>`}else{
 h+=fold('kid','Child',esc(S.childName||'not set'),`<div class=card><p style=margin:0>Name, shown in the app<br><input id=f_child maxlength=40 value="${esc(S.childName)}" placeholder="Your child's first name"></p><p style="margin:8px 0 0"><button class=b onclick="api('settings/save',{child_name:$('f_child').value})">Save</button></p></div>`);
 [['target','Behaviors'],['penalty','Penalties'],['challenge','Weekly challenges']].forEach(([k,t])=>{let g='';const L0=S.items.filter(i=>i.kind===k);L0.forEach((i,x,L)=>g+=`<div class=card><div class="row stk"><div>${esc(i.name)}<br><small>${k==='challenge'?'':i.pmin===i.pmax?i.pmin+' pts':i.pmin+'-'+i.pmax+' pts'}</small></div><div>${mvb('item',i.id,x,L.length)}<button class=b onclick="edit('i',${i.id},'${k}')">Edit</button> <button class="b r" onclick="delItem(${i.id})">✕</button></div></div></div>`);g+=`<button class=b onclick="edit('i',0,'${k}')">+ Add</button>`;h+=fold(k,t,L0.length,g)});
 {let g='';S.rewards.forEach((r,x,L)=>g+=`<div class=card><div class="row stk"><div>${esc(r.name)}<br><small>${r.stars} ★ ${r.points?'+ '+r.points+' pts':''}</small></div><div>${mvb('reward',r.id,x,L.length)}<button class=b onclick="edit('r',${r.id})">Edit</button> <button class="b r" onclick="delRew(${r.id})">✕</button></div></div></div>`);g+=`<button class=b onclick="edit('r',0)">+ Add</button>`;h+=fold('rew','Rewards',S.rewards.length,g)}
 {let g='<small style=margin:4px>Phones and browsers that are logged in. Log out one that is lost or no longer used.</small>';const D=S.devices||[];D.forEach(d=>g+=`<div class=card><div class="row stk"><div>${esc(d.device)} · ${d.role==='parent'?'Parent':esc(S.childName||'Child')}${d.me?' · <b>this device</b>':''}<br><small>Last used ${ago(d.last_seen)} · logged in ${new Date(d.created).toLocaleDateString()}</small></div><div><button class="b r" onclick="revoke(${d.id},${!!d.me})">Log out</button></div></div></div>`);h+=fold('dev','Devices',D.length,g)}}}
 $('app').innerHTML=h+`</main><div class=tabs>${Object.keys(T).map(k=>`<button class="${k===tab?'on':''}" onclick="tab='${k}';render()"><i aria-hidden=true>${T[k][0]}</i>${T[k][1]}</button>`).join('')}</div>`;celebrate()}
api('state');setInterval(()=>{if(S&&document.visibilityState==='visible'&&!ed&&!document.activeElement.matches('input')){const w=wkSel;fetch('/api/state'+wq()).then(r=>r.ok?r.json():0).then(j=>{if(j&&w===wkSel){S=j;render()}})}},5000)
</script></body></html>
