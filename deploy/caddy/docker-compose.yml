# Little Wins plus Caddy, which gets and renews the HTTPS certificate by itself.
# Run from the repository root:
#   docker compose -f deploy/caddy/docker-compose.yml --env-file .env up -d --build
# Needs SITE_HOST in .env (the host name of APP_BASE_URL, for example kids.example.com).
# The host ./data folder must be writable by uid 10001: sudo chown -R 10001:10001 data
services:
  little-wins:
    build: ../..
    restart: unless-stopped
    env_file: ../../.env
    environment:
      # Safe: no port is published, so only Caddy can reach the app on the compose network.
      FORWARDED_ALLOW_IPS: "*"
    expose: ["3000"]
    volumes: ["../../data:/data"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on: [little-wins]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_HOST: ${SITE_HOST:?set SITE_HOST in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]

volumes:
  caddy_data:
  caddy_config:
